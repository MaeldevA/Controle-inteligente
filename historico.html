<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico</title>
  <link rel="stylesheet" href="historico.css">
</head>
<body>
<main class="app">
  <header class="topo-historico">
    <h1>Histórico</h1>

   <button class="botao-calendario" aria-label="Selecionar mês">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
    <path d="M8 3v4M16 3v4M3 10h18"></path>
  </svg>
</button>

<div id="seletor-mes" class="seletor-mes oculto">
  <div class="seletor-mes-topo">
    <span id="ano-seletor"></span>
  </div>

  <div class="meses-grid">
    <button data-mes="0">Jan</button>
    <button data-mes="1">Fev</button>
    <button data-mes="2">Mar</button>
    <button data-mes="3">Abr</button>
    <button data-mes="4">Mai</button>
    <button data-mes="5">Jun</button>
    <button data-mes="6">Jul</button>
    <button data-mes="7">Ago</button>
    <button data-mes="8">Set</button>
    <button data-mes="9">Out</button>
    <button data-mes="10">Nov</button>
    <button data-mes="11">Dez</button>
  </div>
</div>
  </header>

  <div class="filtros-historico">
  <button class="filtro-btn ativo" data-filtro="todos">Todos</button>
<button class="filtro-btn" data-filtro="necessidade">Necessidades</button>
<button class="filtro-btn" data-filtro="desejo">Desejos</button>
</div>
<h2 id="mes-historico">Agosto de 2026</h2>
<section id="lista-gastos" class="lista-gastos">
</section>
<nav class="menu-inferior">
  <button class="menu-item" onclick="window.location.href='inicio.html'">
 <svg class="menu-icone"
     viewBox="0 0 24 24"
     aria-hidden="true"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"></path>
</svg>
  <span>Início</span>
</button>

<button class="menu-item ativo" onclick="window.location.href='historico.html'">
 <svg class="menu-icone" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="12" r="8"></circle>
  <path d="M12 7v5l3 2"></path>
</svg>
  <span>Histórico</span>
</button>
  <button class="menu-item" onclick="window.location.href='relatorio.html'">
  <svg class="menu-icone" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5 20V11"></path>
    <path d="M12 20V5"></path>
    <path d="M19 20V8"></path>
  </svg>
  <span>Relatório</span>
</button>
  <button class="menu-item" onclick="window.location.href='vip.html'">
  <svg class="menu-icone" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 8l4 4 4-7 4 7 4-4-2 10H6L4 8z"></path>
  </svg>
  <span>VIP</span>
</button>
</nav>
</main>
<div id="modal-detalhes" class="modal-detalhes">
 <div id="confirmacao-exclusao" class="confirmacao-exclusao">
  <div class="caixa-confirmacao">

    <div class="icone-lixeira">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16"></path>
        <path d="M9 7V4h6v3"></path>
        <path d="M7 7l1 13h8l1-13"></path>
        <path d="M10 11v5"></path>
        <path d="M14 11v5"></path>
      </svg>
    </div>

    <h2>Excluir gasto</h2>

    <p>Tem certeza que deseja excluir este gasto?</p>

    <div class="acoes-confirmacao">
      <button id="cancelar-exclusao">Cancelar</button>
      <button id="confirmar-exclusao">Excluir</button>
    </div>

  </div>
</div>
  <div class="caixa-detalhes">
    <h2>Detalhes do gasto</h2>

    <p id="detalhe-nome"></p>
    <p id="detalhe-categoria"></p>
    <p id="detalhe-valor"></p>
    <p id="detalhe-data"></p>

    <button id="botao-excluir">Excluir gasto</button>
    <button id="botao-fechar">Cancelar</button>
  </div>
</div>
<script src="historico.js"></script>
</body>
</html>
