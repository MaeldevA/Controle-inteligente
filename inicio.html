<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Inteligente</title>
  <link rel="stylesheet" href="inicio.css">
</head>
<body>
<main class="app">
<h1>Controle <span>Inteligente</span></h1>
<p class="saudacao">Olá, <span id="nome-usuario">usuário</span>! 👋</p>
<p class="resumo">Resumo de <span id="mes-atual"></span></p>
<section class="total-gasto">
  <p>Total Gasto</p>
  <h2 id="valor-total">R$ 0,00</h2>
</section>
<div class="categorias">
  <div class="categoria">
    <p>Necessidades</p>
    <strong id="valor-necessidades">R$ 0,00</strong>
    <span id="porcentagem-necessidades" class="porcentagem necessidades">0%</span>
  </div>

  <div class="categoria">
    <p>Desejos</p>
    <strong id="valor-desejos">R$ 0,00</strong>
    <span id="porcentagem-desejos" class="porcentagem desejos">0%</span>
  </div>
</div>
<section class="dica-dia">
  <h3>💡 Dica do dia</h3>
  <p id="texto-dica">Antes de comprar, pergunte-se: “eu realmente preciso disso?”</p>
</section>
<button class="adicionar-gasto">+ Adicionar Gasto</button>
<button class="ver-relatorio" onclick="window.location.href='relatorio.html'">Ver Relatório</button>
<nav class="menu-inferior">
  <button class="menu-item ativo">
  <svg class="menu-icone" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"></path>
  </svg>
  <span>Início</span>
</button>
<button class="menu-item" onclick="window.location.href='historico.html'">
  <svg class="menu-icone" viewBox="0 0 24 24" aria-hidden="true">
  <circle cx="12" cy="12" r="8"></circle>
  <path d="M12 7v5l3 2"></path>
</svg>
  <span>Histórico</span>
</button>
  <button class="menu-item" onclick="window.location.href='relatorio.html'">
  <svg class="menu-icone" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5 20V11"></path>
    <path d="M12 20V5"></path>
    <path d="M19 20V8"></path>
  </svg>
  <span>Relatório</span>
</button>
  <button class="menu-item" onclick="window.location.href='vip.html'">
  <svg class="menu-icone" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 8l4 4 4-7 4 7 4-4-2 10H6L4 8z"></path>
  </svg>
  <span>VIP</span>
</button>
</nav>
<div id="modal-gasto" class="modal-gasto">
  <div class="modal-conteudo">
    <h2 class="titulo-modal">Novo Gasto</h2>
    <button type="button" id="fechar-modal">X</button>
    <label for="nome-compra">Nome da compra</label>
<input id="nome-compra" type="text" placeholder="Ex: Almoço">
<label for="valor-compra">Valor (R$)</label>
<input id="valor-compra" type="number" step="0.01" min="0" placeholder="Ex: 35,00">
<label for="categoria-compra">Categoria</label>
<select id="categoria-compra">
  <option value="" disabled selected>Selecione uma categoria</option>
  <option value="alimentacao">Alimentação</option>
  <option value="transporte">Transporte</option>
  <option value="moradia">Moradia</option>
  <option value="saude">Saúde</option>
  <option value="educacao">Educação</option>
  <option value="lazer">Lazer</option>
  <option value="compras">Compras</option>
  <option value="servicos">Serviços</option>
  <option value="contas-taxas">Contas e Taxas</option>
  <option value="outros">Outros</option>
</select>
<p>Tipo de gasto</p>

<div class="tipo-gasto">
  <button type="button" id="tipo-necessidade" class="tipo-btn ativo">
    Necessidade
  </button>

  <button type="button" id="tipo-desejo" class="tipo-btn">
    Desejo
  </button>
</div>
<label for="data-compra">Data</label>
<input id="data-compra" type="date">
<button type="button" id="salvar-gasto">Salvar Gasto</button>
  </div>
</div>
</main>
<script src="inicio.js"></script>
</body>
</html>
